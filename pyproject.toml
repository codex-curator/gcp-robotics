[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gcp-robotics"
version = "2.0.0"
description = "Golden Codex Protocol — Sub-millisecond robotic perception via hash-indexed Spatial Kinematic Blueprints"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "Tad MacPherson", email = "research@iaeternum.ai"},
]
keywords = [
    "robotics",
    "perception",
    "perceptual-hashing",
    "VLA",
    "spatial-kinematic-blueprints",
    "ROS2",
    "control-barrier-functions",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "pydantic>=2.0",
    "Pillow>=9.0",
    "numpy>=1.24",
    "imagehash>=4.3",
    "httpx>=0.25",
    "tenacity>=8.2",
]

[project.optional-dependencies]
llm = ["anthropic>=0.18"]
ros2 = []
test = ["pytest>=7.0", "pytest-asyncio>=0.21"]
all = ["gcp-robotics[llm,test]"]

[project.urls]
Homepage = "https://iaeternum.ai/robotics"
Documentation = "https://github.com/codex-curator/golden-codex-core"
Repository = "https://github.com/codex-curator/golden-codex-core"
"Research Paper" = "https://doi.org/10.5281/zenodo.18667749"
"Lab Kit" = "https://github.com/codex-curator/codex-lab-kit"

[tool.setuptools.packages.find]
include = ["gcp_robotics*", "codex_ros2*"]
exclude = ["tests*", "examples*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
